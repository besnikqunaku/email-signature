<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Signatures — Besnik Qunaku</title>
<meta name="description" content="HTML email signature designs by Besnik Qunaku.">
<style>
  :root{
    --chrome:#E7EAEF; --card:#FFFFFF; --edge:#D3D9E2;
    --ink:#0E1218; --mid:#59616D; --dim:#8B94A1;
    --btn:#0E1218; --btn-ink:#FFFFFF; --ok:#1E7A4F;
    --mono:'Courier New',Courier,ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--chrome:#15181D; --edge:#2A2F37; --ink:#F0F2F5; --mid:#A2ABB8; --dim:#767F8C;
          --btn:#F0F2F5; --btn-ink:#0E1218; --ok:#4BC98A}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--chrome);color:var(--ink);font:15px/1.6 var(--sans)}
  .wrap{max-width:760px;margin:0 auto;padding:64px 20px 110px}

  header{margin:0 0 52px}
  h1{margin:0;font-size:38px;line-height:1.05;letter-spacing:-1.4px;font-weight:700}
  .who{margin:14px 0 0;font-family:var(--mono);font-size:12.5px;letter-spacing:.2px;color:var(--mid)}
  nav{margin:20px 0 0;display:flex;gap:18px;flex-wrap:wrap}
  nav a{font-family:var(--mono);font-size:12.5px;color:var(--ink);text-decoration:none;
    border-bottom:1px solid var(--edge);padding-bottom:2px}
  nav a:hover,nav a:focus-visible{border-bottom-color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--edge);border-radius:10px;
    margin:0 0 22px;overflow:hidden;box-shadow:0 1px 2px rgba(14,18,24,.04)}
  .bar{display:flex;align-items:center;gap:12px;padding:11px 14px;
    border-bottom:1px solid #E9ECF1;background:#FBFCFD}
  .name{font-family:var(--mono);font-size:12.5px;font-weight:700;color:#0E1218;
    letter-spacing:.2px;white-space:nowrap}
  .tag{font-family:var(--mono);font-size:11px;color:#98A1AE;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button{flex:none;background:var(--btn);color:var(--btn-ink);border:0;border-radius:6px;
    padding:7px 14px;font:700 11.5px/1 var(--mono);letter-spacing:.6px;cursor:pointer}
  button:hover{opacity:.85}
  button.done{background:var(--ok);color:#fff}
  :focus-visible{outline:2px solid #2F6BFF;outline-offset:2px}
  .stage{background:#fff;padding:36px 28px;overflow-x:auto}

  @media (max-width:600px){
    .wrap{padding:40px 15px 80px}
    h1{font-size:29px;letter-spacing:-.9px}
    .stage{padding:24px 16px}
    .tag{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Email&nbsp;signatures</h1>
    <p class="who">Besnik Qunaku &nbsp;/&nbsp; Software Developer &nbsp;/&nbsp; <!--COUNT--> designs</p>
    <nav>
      <a href="https://www.linkedin.com/in/besnik-qunaku-4a6b85229/">LinkedIn</a>
      <a href="https://github.com/besnikqunaku/email-signature">GitHub</a>
      <a href="mailto:b.qunaku7@gmail.com">b.qunaku7@gmail.com</a>
    </nav>
  </header>

  <main>
<!--CARDS-->  </main>

</div>
<script>
function copySig(id, btn){
  var el = document.getElementById(id);
  var range = document.createRange();
  range.selectNodeContents(el);
  var sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e) { ok = false; }
  sel.removeAllRanges();
  btn.textContent = ok ? 'COPIED' : 'SELECT';
  btn.className = ok ? 'done' : '';
  setTimeout(function(){ btn.textContent = 'COPY'; btn.className = ''; }, 2000);
}
</script>
</body>
</html>
